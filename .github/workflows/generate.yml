name: Generate assets

# Committing a request file to generation/requests/ starts a run. A daily run resumes
# candidates that were waiting for free limits to reset. API keys come from repo secrets.
on:
  push:
    paths: ['generation/requests/**']
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      quote:
        description: 'Batch to price on Retro Diffusion (free cost check, generates nothing). Leave empty for a normal run.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/gen/requirements.txt
      - run: pip install -r scripts/gen/requirements.txt
      - name: Generate
        if: ${{ !inputs.quote }}
        run: python scripts/gen/run.py
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          RETRO_DIFFUSION_API_KEY: ${{ secrets.RETRO_DIFFUSION_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Price check
        if: ${{ inputs.quote }}
        run: python scripts/gen/run.py --quote "${{ inputs.quote }}"
        env:
          RETRO_DIFFUSION_API_KEY: ${{ secrets.RETRO_DIFFUSION_API_KEY }}
      - name: Commit candidates
        id: commit
        run: |
          git add generation/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "night-parade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generated candidates (run ${{ github.run_number }})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made by this workflow don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
